; Build: install PlatformIO (VS Code extension or `pip install platformio`), then from this folder:
;   pio run -e writer       (robot 1)      pio run -e executor   (robot 2)      pio run -e hub   (outside node)
;   pio run -e writer -t upload
; The ESP32 environments have NOT been built in the project's CI/sandbox (no PlatformIO toolchain there).
[platformio]
default_envs = writer

[env]
platform = espressif32@^6.9.0          ; Arduino-ESP32 core 2.0.x (ledcSetup/ledcAttachPin API)
board = esp32dev
framework = arduino
lib_deps = nrf24/RF24@^1.4.8
build_flags =
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/../comms/firmware
    -DCORE_DEBUG_LEVEL=0
monitor_speed = 921600

[env:writer]
build_flags = ${env.build_flags} -DFW_ROLE_WRITER

[env:executor]
build_flags = ${env.build_flags} -DFW_ROLE_EXECUTOR

[env:hub]
build_flags = ${env.build_flags} -DFW_ROLE_HUB
